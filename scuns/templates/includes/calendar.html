<section class="panel calendar" id="calendar" aria-labelledby="calendar-heading">
    <div class="section-heading"><h2 id="calendar-heading">Твоя неделя</h2><button type="button" id="calendar-today">Сегодня</button></div>
    <div class="calendar-toolbar"><button type="button" id="week-prev" aria-label="Предыдущая неделя">←</button><span id="week-label" aria-live="polite"></span><button type="button" id="week-next" aria-label="Следующая неделя">→</button></div>
    <div class="calendar-days" id="calendar-days" role="group" aria-label="Выбрать день недели"></div>
    <div class="calendar-summary"><strong data-selected-full></strong><p class="muted" data-day-summary aria-live="polite"></p><a class="text-link" href="#tasks">К задачам на этот день →</a></div>
    <p class="calendar-note">Точка под датой означает, что на этот день есть задачи.</p>
</section>
